<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animation + localStorage Example</title>
<style>
  body {
    background: #121212;
    color: #c8f7c5;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 50px;
  }

  img {
    width: 150px;
    margin: 20px;
    transition: transform 0.5s ease;
  }

  .animate {
    animation: bounce 1s ease;
  }

  @keyframes bounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.5) rotate(20deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  button, select {
    padding: 10px 20px;
    border: none;
    background-color: #1abc9c;
    color: white;
    font-size: 16px;
    margin: 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  button:hover, select:hover {
    background-color: #16a085;
  }
</style>
</head>
<body>

<h1>Image Bounce Animation</h1>

<img id="myImage" src="plp.png" alt="Placeholder Image">

<br>

<button id="animateBtn">Animate Image</button>

<br>

<label for="speedSelect">Animation Speed: </label>
<select id="speedSelect">
  <option value="0.5s">Fast</option>
  <option value="1s">Normal</option>
  <option value="2s">Slow</option>
</select>

<script>
// === Helper: Load saved speed from localStorage ===
function loadPreference() {
  const savedSpeed = localStorage.getItem('animationSpeed');
  const select = document.getElementById('speedSelect');

  if (savedSpeed) {
    select.value = savedSpeed;
    document.documentElement.style.setProperty('--animation-speed', savedSpeed);
  }
}

// === Save user preference ===
function savePreference(speed) {
  localStorage.setItem('animationSpeed', speed);
}

// === Trigger animation ===
function triggerAnimation() {
  const img = document.getElementById('myImage');
  const speed = document.getElementById('speedSelect').value;

  // Apply user-selected speed to CSS animation
  img.style.animationDuration = speed;

  // Add animation class
  img.classList.add('animate');

  // Remove class after animation ends so it can be triggered again
  img.addEventListener('animationend', () => {
    img.classList.remove('animate');
  }, { once: true });
}

// === Event Listeners ===
document.getElementById('animateBtn').addEventListener('click', triggerAnimation);

document.getElementById('speedSelect').addEventListener('change', function() {
  savePreference(this.value);
});

// === Initialize ===
loadPreference();
</script>

</body>
</html>
